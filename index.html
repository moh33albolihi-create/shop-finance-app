<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const STORAGE_KEY = "shop-finance-data-v1";
const AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

const DEFAULT_DATA = {
  settings: { shopName: "محل الصيانة", currency: "ريال", initialBalance: 0 },
  cashLog: [], // {id,date,type:'add'|'deduct',kind,amount,notes,linkedTxId,createdAt}
  networkLog: [], // {id,date,type:'add'|'deduct',kind,amount,notes,linkedTxId,createdAt}
  categories: {
    income: ["صيانة", "بيع قطعة", "بيع جهاز", "مرتجع مشتريات", "أخرى"],
    expense: ["إيجار", "قطع غيار", "رواتب", "كهرباء", "مشتريات", "أدوات", "تسويق", "شراء أجهزة", "تسديد مناديب", "أخرى"],
  },
  partners: [],
  transactions: [],
  obligations: [],
  devices: [],
  suppliers: [], // {id,name,phone,notes,entries:[{id,type:'debt'|'payment',amount,date,notes,linkedTxId,createdAt}],createdAt}
  closings: [], // {id,date,openingBalance,income,expense,withdraw,net,closingBalance,notes,closedAt}
  inventory: [], // {id,name,category,quantity,unitCost,unitPrice,minQty,notes,createdAt}
  purchaseInvoices: [], // {id,invoiceNo,supplierId,supplierName,date,items:[{name,qty,unitCost,lineTotal}],total,paymentType:'cash'|'credit',linkedTxId,linkedEntryId,notes,createdAt}
  employees: [], // {id,name,phone,monthlySalary,notes,entries:[{id,amount,date,notes,linkedTxId,createdAt}],createdAt}
  safeLog: [], // {id,date,type:'add'|'deduct',amount,source:'cash'|'network'|null,notes,createdAt}
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmt(n) { return Number(n || 0).toLocaleString("ar-SA", { maximumFractionDigits: 2 }); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function monthKey(d) { return d.slice(0, 7); }
function csvEscape(s) { const str = String(s ?? ""); return /[",\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str; }
function downloadFile(filename, content, mime = "text/csv;charset=utf-8;") {
  const blob = new Blob(["\uFEFF" + content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function buildInvoiceText(shopName, invoice, currency) {
  const lines = [];
  lines.push(`🧾 فاتورة مشتريات رقم ${invoice.invoiceNo} — ${shopName}`);
  lines.push(`التاريخ: ${invoice.date}`);
  if (invoice.supplierName) lines.push(`المورد: ${invoice.supplierName}`);
  lines.push("");
  lines.push("الأصناف:");
  invoice.items.forEach((it, i) => lines.push(`${i + 1}. ${it.name} — الكمية: ${it.qty} × ${fmt(it.unitCost)} = ${fmt(it.lineTotal)} ${currency}`));
  lines.push("");
  lines.push(`الإجمالي: ${fmt(invoice.total)} ${currency}`);
  lines.push(`طريقة الدفع: ${invoice.paymentType === "cash" ? "نقدي (مسجل كمصروف)" : "على الحساب (مسجل كدين على المورد)"}`);
  if (invoice.notes) lines.push(`ملاحظات: ${invoice.notes}`);
  return lines.join("\n");
}

function printInvoice(shopName, invoice, currency) {
  const rows = invoice.items.map((it, i) => `<tr><td>${i + 1}</td><td>${it.name}</td><td>${it.qty}</td><td>${fmt(it.unitCost)}</td><td>${fmt(it.lineTotal)}</td></tr>`).join("");
  const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>فاتورة ${invoice.invoiceNo}</title>
  <style>
    body{font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif; padding:28px; color:#24302B;}
    h1{font-size:20px; margin-bottom:4px;}
    .sub{color:#66766F; font-size:13px; margin-bottom:20px;}
    table{width:100%; border-collapse:collapse; margin-top:10px;}
    th,td{border:1px solid #CFD9D6; padding:8px; text-align:right; font-size:13px;}
    th{background:#F3F6F5;}
    .total{margin-top:16px; font-size:16px; font-weight:bold; text-align:left;}
    @media print { button{display:none;} }
  </style></head>
  <body>
    <h1>فاتورة مشتريات رقم ${invoice.invoiceNo}</h1>
    <div class="sub">${shopName} — ${invoice.date}${invoice.supplierName ? " — المورد: " + invoice.supplierName : ""}</div>
    <table>
      <thead><tr><th>#</th><th>الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="total">الإجمالي الكلي: ${fmt(invoice.total)} ${currency}</div>
    <div class="sub">طريقة الدفع: ${invoice.paymentType === "cash" ? "نقدي" : "على الحساب"}</div>
  </body></html>`;
  const w = window.open("", "_blank");
  if (!w) return false;
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 300);
  return true;
}

function buildClosingText(shopName, date, opening, closing, income, expense, withdraw, net, dayTx, currency) {
  const lines = [];
  lines.push(`📋 تقفيلة يوم ${date} — ${shopName}`);
  lines.push("");
  lines.push(`رصيد بداية اليوم: ${fmt(opening)} ${currency}`);
  lines.push(`رصيد نهاية اليوم: ${fmt(closing)} ${currency}`);
  lines.push("");
  lines.push(`📈 الإيرادات: ${fmt(income)} ${currency}`);
  lines.push(`📉 المصروفات: ${fmt(expense)} ${currency}`);
  lines.push(`↗ السحوبات: ${fmt(withdraw)} ${currency}`);
  lines.push(`🏦 صافي الربح: ${fmt(net)} ${currency}`);
  lines.push("");
  lines.push(`عدد العمليات: ${dayTx.length}`);
  if (dayTx.length) {
    lines.push("");
    lines.push("تفاصيل العمليات:");
    dayTx.forEach((t, i) => {
      const name = t.type === "withdraw" ? t.person : t.title;
      const sign = t.type === "income" ? "+" : "-";
      lines.push(`${i + 1}. ${TYPE_META[t.type].label} — ${name} — ${sign}${fmt(t.amount)} ${currency}`);
    });
  }
  return lines.join("\n");
}

function printClosing(shopName, date, opening, closing, income, expense, withdraw, net, dayTx, currency) {
  const rows = dayTx.map((t, i) => {
    const name = t.type === "withdraw" ? t.person : t.title;
    const sign = t.type === "income" ? "+" : "-";
    return `<tr><td>${i + 1}</td><td>${TYPE_META[t.type].label}</td><td>${name}</td><td>${t.category || ""}</td><td>${sign}${fmt(t.amount)}</td></tr>`;
  }).join("");
  const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>تقفيلة ${date}</title>
  <style>
    body{font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif; padding:28px; color:#24302B;}
    h1{font-size:20px; margin-bottom:4px;}
    .sub{color:#66766F; font-size:13px; margin-bottom:20px;}
    .grid{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;}
    .card{border:1px solid #CFD9D6; border-radius:12px; padding:12px 16px; min-width:140px;}
    .card .label{font-size:11px; color:#889A94; margin-bottom:4px;}
    .card .value{font-size:16px; font-weight:bold;}
    table{width:100%; border-collapse:collapse; margin-top:10px;}
    th,td{border:1px solid #CFD9D6; padding:8px; text-align:right; font-size:13px;}
    th{background:#F3F6F5;}
    @media print { button{display:none;} }
  </style></head>
  <body>
    <h1>تقفيلة يوم ${date}</h1>
    <div class="sub">${shopName}</div>
    <div class="grid">
      <div class="card"><div class="label">رصيد بداية اليوم</div><div class="value">${fmt(opening)} ${currency}</div></div>
      <div class="card"><div class="label">رصيد نهاية اليوم</div><div class="value">${fmt(closing)} ${currency}</div></div>
      <div class="card"><div class="label">الإيرادات</div><div class="value" style="color:#146350">${fmt(income)} ${currency}</div></div>
      <div class="card"><div class="label">المصروفات</div><div class="value" style="color:#A84A34">${fmt(expense)} ${currency}</div></div>
      <div class="card"><div class="label">السحوبات</div><div class="value" style="color:#A47A20">${fmt(withdraw)} ${currency}</div></div>
      <div class="card"><div class="label">صافي الربح</div><div class="value" style="color:#285070">${fmt(net)} ${currency}</div></div>
    </div>
    <table>
      <thead><tr><th>#</th><th>النوع</th><th>الاسم</th><th>التصنيف</th><th>المبلغ</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:#889A94;">لا توجد عمليات</td></tr>'}</tbody>
    </table>
  </body></html>`;
  const w = window.open("", "_blank");
  if (!w) return false;
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 300);
  return true;
}

const LEDGER_KIND_META = {
  expense: { icon: "📉", label: "مصروف", color: "#A84A34" },
  supplier: { icon: "🚚", label: "مندوب", color: "#A47A20" },
  employee: { icon: "🧑‍🔧", label: "راتب", color: "#285070" },
  withdraw: { icon: "↗", label: "سحب", color: "#A47A20" },
  safe: { icon: "🔒", label: "خزنة", color: "#66766F" },
  manual: { icon: "✏️", label: "يدوي", color: "#66766F" },
};

const TYPE_META = {
  income: { label: "إيراد", color: "#146350", bg: "#EAF3EE", icon: "↑" },
  expense: { label: "مصروف", color: "#A84A34", bg: "#FBEEEC", icon: "↓" },
  withdraw: { label: "سحب", color: "#A47A20", bg: "#FBF2E1", icon: "↗" },
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return DEFAULT_DATA;
    const parsed = JSON.parse(raw);
    const settings = { ...DEFAULT_DATA.settings, ...parsed.settings };
    if (parsed.settings && (parsed.settings.initialCashBalance !== undefined || parsed.settings.initialNetworkBalance !== undefined) && parsed.settings.initialBalance === undefined) {
      settings.initialBalance = Number(parsed.settings.initialCashBalance || 0) + Number(parsed.settings.initialNetworkBalance || 0);
    }
    let networkLog = parsed.networkLog || [];
    if (!parsed.networkLog && parsed.settings && Number(parsed.settings.networkAmount || 0) > 0) {
      networkLog = [{ id: uid(), date: todayISO(), type: "add", kind: "manual", amount: Number(parsed.settings.networkAmount), notes: "رصيد سابق", createdAt: new Date().toISOString() }];
    }
    let cashLog = parsed.cashLog || [];
    if (!parsed.cashLog && parsed.settings && Number(parsed.settings.cashAmount || 0) !== 0) {
      cashLog = [{ id: uid(), date: todayISO(), type: "add", kind: "manual", amount: Number(parsed.settings.cashAmount), notes: "رصيد سابق", createdAt: new Date().toISOString() }];
    }
    delete settings.networkAmount;
    delete settings.cashAmount;
    return {
      ...DEFAULT_DATA, ...parsed,
      settings,
      networkLog,
      cashLog,
      categories: { ...DEFAULT_DATA.categories, ...parsed.categories },
      obligations: parsed.obligations || [],
      partners: parsed.partners || [],
      transactions: parsed.transactions || [],
      devices: parsed.devices || [],
      suppliers: parsed.suppliers || [],
      closings: parsed.closings || [],
      inventory: parsed.inventory || [],
      purchaseInvoices: parsed.purchaseInvoices || [],
      employees: (parsed.employees || []).map(e => ({ attendance: [], ...e })),
      safeLog: parsed.safeLog || [],
    };
  } catch (e) { return DEFAULT_DATA; }
}

function App() {
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState("dashboard");
  const [addOpen, setAddOpen] = useState(false);
  const [addType, setAddType] = useState("income");
  const [editItem, setEditItem] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [toast, setToast] = useState(null);
  const [networkLogOpen, setNetworkLogOpen] = useState(false);
  const [quickDailyOpen, setQuickDailyOpen] = useState(false);

  const cashTotal = useMemo(() => data.cashLog.reduce((s, e) => s + (e.type === "deduct" ? -e.amount : e.amount), 0), [data.cashLog]);
  const networkTotal = useMemo(() => data.networkLog.reduce((s, e) => s + (e.type === "deduct" ? -e.amount : e.amount), 0), [data.networkLog]);
  const safeTotal = useMemo(() => data.safeLog.reduce((s, e) => s + (e.type === "deduct" ? -e.amount : e.amount), 0), [data.safeLog]);
  const [cashLogOpen, setCashLogOpen] = useState(false);
  const [safeLogOpen, setSafeLogOpen] = useState(false);

  const persist = useCallback((next) => {
    setData(next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); }
    catch (e) { showToast("تعذر حفظ البيانات على هذا الجهاز", "error"); }
  }, []);

  function showToast(msg, kind = "ok") {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 2200);
  }

  const totals = useMemo(() => {
    let income = 0, expense = 0, withdraw = 0;
    for (const t of data.transactions) {
      if (t.type === "income") income += t.amount;
      else if (t.type === "expense") expense += t.amount;
      else if (t.type === "withdraw") withdraw += t.amount;
    }
    const netProfit = income - expense;
    const balance = Number(data.settings.initialBalance || 0) + income - expense - withdraw;
    return { income, expense, withdraw, netProfit, balance };
  }, [data]);

  const now = new Date();
  const curMonth = now.toISOString().slice(0, 7);
  const curYear = String(now.getFullYear());

  const monthTotals = useCallback((mKey) => {
    let income = 0, expense = 0, withdraw = 0;
    for (const t of data.transactions) {
      if (monthKey(t.date) !== mKey) continue;
      if (t.type === "income") income += t.amount;
      else if (t.type === "expense") expense += t.amount;
      else if (t.type === "withdraw") withdraw += t.amount;
    }
    return { income, expense, withdraw, net: income - expense };
  }, [data]);

  const yearTotals = useCallback((year) => {
    let income = 0, expense = 0, withdraw = 0;
    const byMonth = AR_MONTHS.map((name, idx) => {
      const mKey = `${year}-${String(idx + 1).padStart(2, "0")}`;
      const mt = monthTotals(mKey);
      income += mt.income; expense += mt.expense; withdraw += mt.withdraw;
      return { name, mKey, ...mt };
    });
    return { income, expense, withdraw, net: income - expense, byMonth };
  }, [monthTotals]);

  function upsertTransaction(payload) {
    let networkLog = data.networkLog;
    let cashLog = data.cashLog;
    let safeLog = data.safeLog;
    const source = payload.paymentSource || "none"; // 'none' | 'cash' | 'network' | 'safe'

    if (payload.id) {
      const old = data.transactions.find(t => t.id === payload.id);
      const updated = { ...old, ...payload };
      const oldNetId = old.linkedNetworkEntryId || null;
      const oldCashId = old.linkedCashEntryId || null;
      const oldSafeId = old.linkedSafeEntryId || null;

      // remove stale links that no longer match the chosen source
      if (oldNetId && source !== "network") { networkLog = networkLog.filter(e => e.id !== oldNetId); updated.linkedNetworkEntryId = null; }
      if (oldCashId && source !== "cash") { cashLog = cashLog.filter(e => e.id !== oldCashId); updated.linkedCashEntryId = null; }
      if (oldSafeId && source !== "safe") { safeLog = safeLog.filter(e => e.id !== oldSafeId); updated.linkedSafeEntryId = null; }

      if (source === "network") {
        if (oldNetId) {
          networkLog = networkLog.map(e => e.id === oldNetId ? { ...e, amount: Number(updated.amount), date: updated.date, notes: `مصروف: ${updated.title}`, kind: "expense" } : e);
        } else {
          const entryId = uid();
          networkLog = [{ id: entryId, date: updated.date, type: "deduct", amount: Number(updated.amount), notes: `مصروف: ${updated.title}`, kind: "expense", linkedTxId: updated.id, createdAt: new Date().toISOString() }, ...networkLog];
          updated.linkedNetworkEntryId = entryId;
        }
      } else if (source === "cash") {
        if (oldCashId) {
          cashLog = cashLog.map(e => e.id === oldCashId ? { ...e, amount: Number(updated.amount), date: updated.date, notes: `مصروف: ${updated.title}`, kind: "expense" } : e);
        } else {
          const entryId = uid();
          cashLog = [{ id: entryId, date: updated.date, type: "deduct", amount: Number(updated.amount), notes: `مصروف: ${updated.title}`, kind: "expense", linkedTxId: updated.id, createdAt: new Date().toISOString() }, ...cashLog];
          updated.linkedCashEntryId = entryId;
        }
      } else if (source === "safe") {
        if (oldSafeId) {
          safeLog = safeLog.map(e => e.id === oldSafeId ? { ...e, amount: Number(updated.amount), date: updated.date, notes: `مصروف: ${updated.title}`, kind: "expense" } : e);
        } else {
          const entryId = uid();
          safeLog = [{ id: entryId, date: updated.date, type: "deduct", amount: Number(updated.amount), notes: `مصروف: ${updated.title}`, kind: "expense", linkedTxId: updated.id, createdAt: new Date().toISOString() }, ...safeLog];
          updated.linkedSafeEntryId = entryId;
        }
      }
      persist({ ...data, transactions: data.transactions.map(t => t.id === payload.id ? updated : t), networkLog, cashLog, safeLog });
      showToast("تم تحديث العملية");
    } else {
      const item = { ...payload, id: uid(), createdAt: new Date().toISOString() };
      if (source === "network") {
        const entryId = uid();
        networkLog = [{ id: entryId, date: item.date, type: "deduct", amount: Number(item.amount), notes: `مصروف: ${item.title}`, kind: "expense", linkedTxId: item.id, createdAt: new Date().toISOString() }, ...networkLog];
        item.linkedNetworkEntryId = entryId;
      } else if (source === "cash") {
        const entryId = uid();
        cashLog = [{ id: entryId, date: item.date, type: "deduct", amount: Number(item.amount), notes: `مصروف: ${item.title}`, kind: "expense", linkedTxId: item.id, createdAt: new Date().toISOString() }, ...cashLog];
        item.linkedCashEntryId = entryId;
      } else if (source === "safe") {
        const entryId = uid();
        safeLog = [{ id: entryId, date: item.date, type: "deduct", amount: Number(item.amount), notes: `مصروف: ${item.title}`, kind: "expense", linkedTxId: item.id, createdAt: new Date().toISOString() }, ...safeLog];
        item.linkedSafeEntryId = entryId;
      }
      persist({ ...data, transactions: [item, ...data.transactions], networkLog, cashLog, safeLog });
      showToast("تمت إضافة العملية");
    }
    setAddOpen(false); setEditItem(null);
  }

  function deleteTransaction(id) {
    const t = data.transactions.find(x => x.id === id);
    const networkLog = t?.linkedNetworkEntryId ? data.networkLog.filter(e => e.id !== t.linkedNetworkEntryId) : data.networkLog;
    const cashLog = t?.linkedCashEntryId ? data.cashLog.filter(e => e.id !== t.linkedCashEntryId) : data.cashLog;
    const safeLog = t?.linkedSafeEntryId ? data.safeLog.filter(e => e.id !== t.linkedSafeEntryId) : data.safeLog;
    persist({ ...data, transactions: data.transactions.filter(t => t.id !== id), networkLog, cashLog, safeLog });
    setConfirmDelete(null);
    showToast("تم الحذف");
  }

  function updateSettings(patch) { persist({ ...data, settings: { ...data.settings, ...patch } }); }

  function addCashEntry(entry) {

  function createPurchaseInvoice(payload) {
    const total = payload.items.reduce((s, it) => s + Number(it.qty) * Number(it.unitCost), 0);
    let inventory = [...data.inventory];
    payload.items.forEach(it => {
      const idx = inventory.findIndex(inv => inv.name.trim().toLowerCase() === it.name.trim().toLowerCase());
      if (idx >= 0) {
        inventory[idx] = { ...inventory[idx], quantity: Number(inventory[idx].quantity || 0) + Number(it.qty), unitCost: Number(it.unitCost) };
      } else {
        inventory.push({ id: uid(), name: it.name.trim(), category: "", quantity: Number(it.qty), unitCost: Number(it.unitCost), unitPrice: 0, minQty: 0, notes: "", createdAt: new Date().toISOString() });
      }
    });

    let transactions = data.transactions;
    let suppliers = data.suppliers;
    let linkedTxId = null, linkedEntryId = null;
    const itemsSummary = payload.items.map(it => `${it.name} × ${it.qty}`).join("، ");

    if (payload.paymentType === "cash") {
      linkedTxId = uid();
      transactions = [{
        id: linkedTxId, type: "expense", title: `فاتورة مشتريات${payload.supplierName ? " - " + payload.supplierName : ""}`,
        category: "مشتريات", amount: total, date: payload.date, notes: itemsSummary, createdAt: new Date().toISOString(),
      }, ...transactions];
    } else if (payload.supplierId) {
      linkedEntryId = uid();
      suppliers = suppliers.map(s => s.id === payload.supplierId ? {
        ...s, entries: [{ id: linkedEntryId, type: "debt", amount: total, date: payload.date, notes: `فاتورة مشتريات: ${itemsSummary}`, linkedTxId: null, createdAt: new Date().toISOString() }, ...s.entries],
      } : s);
    }

    const invoice = {
      id: uid(), invoiceNo: (data.purchaseInvoices.length + 1), supplierId: payload.supplierId || null, supplierName: payload.supplierName || "",
      date: payload.date, items: payload.items.map(it => ({ name: it.name.trim(), qty: Number(it.qty), unitCost: Number(it.unitCost), lineTotal: Number(it.qty) * Number(it.unitCost) })),
      total, paymentType: payload.paymentType, linkedTxId, linkedEntryId, notes: payload.notes || "", returns: [], createdAt: new Date().toISOString(),
    };

    persist({ ...data, inventory, transactions, suppliers, purchaseInvoices: [invoice, ...data.purchaseInvoices] });
    showToast("تم حفظ الفاتورة وتحديث المخزون");
  }

  function deletePurchaseInvoice(id) {
    const inv = data.purchaseInvoices.find(i => i.id === id);
    if (!inv) return;
    let transactions = data.transactions;
    let suppliers = data.suppliers;
    if (inv.linkedTxId) transactions = transactions.filter(t => t.id !== inv.linkedTxId);
    if (inv.linkedEntryId && inv.supplierId) {
      suppliers = suppliers.map(s => s.id === inv.supplierId ? { ...s, entries: s.entries.filter(e => e.id !== inv.linkedEntryId) } : s);
    }
    (inv.returns || []).forEach(ret => {
      if (ret.linkedTxId) transactions = transactions.filter(t => t.id !== ret.linkedTxId);
      if (ret.linkedEntryId && inv.supplierId) suppliers = suppliers.map(s => s.id === inv.supplierId ? { ...s, entries: s.entries.filter(e => e.id !== ret.linkedEntryId) } : s);
    });
    persist({ ...data, transactions, suppliers, purchaseInvoices: data.purchaseInvoices.filter(i => i.id !== id) });
    showToast("تم حذف الفاتورة (الكميات المضافة للمخزون تبقى كما هي)");
  }

  function addInvoiceReturn(invoiceId, payload) {
    const invoice = data.purchaseInvoices.find(i => i.id === invoiceId);
    if (!invoice) return;
    const total = payload.items.reduce((s, it) => s + Number(it.qty) * Number(it.unitCost), 0);
    let inventory = [...data.inventory];
    payload.items.forEach(it => {
      const idx = inventory.findIndex(inv => inv.name.trim().toLowerCase() === it.name.trim().toLowerCase());
      if (idx >= 0) inventory[idx] = { ...inventory[idx], quantity: Math.max(0, Number(inventory[idx].quantity || 0) - Number(it.qty)) };
    });

    let transactions = data.transactions;
    let suppliers = data.suppliers;
    let linkedTxId = null, linkedEntryId = null;
    const itemsSummary = payload.items.map(it => `${it.name} × ${it.qty}`).join("، ");

    if (invoice.paymentType === "cash") {
      linkedTxId = uid();
      transactions = [{
        id: linkedTxId, type: "income", title: `مرتجع فاتورة #${invoice.invoiceNo}`, category: "مرتجع مشتريات",
        amount: total, date: payload.date, notes: itemsSummary, createdAt: new Date().toISOString(),
      }, ...transactions];
    } else if (invoice.supplierId) {
      linkedEntryId = uid();
      suppliers = suppliers.map(s => s.id === invoice.supplierId ? {
        ...s, entries: [{ id: linkedEntryId, type: "return", amount: total, date: payload.date, notes: `رجيع فاتورة #${invoice.invoiceNo}: ${itemsSummary}`, linkedTxId: null, createdAt: new Date().toISOString() }, ...s.entries],
      } : s);
    }

    const ret = {
      id: uid(), date: payload.date, items: payload.items.map(it => ({ name: it.name.trim(), qty: Number(it.qty), unitCost: Number(it.unitCost), lineTotal: Number(it.qty) * Number(it.unitCost) })),
      total, notes: payload.notes || "", linkedTxId, linkedEntryId, createdAt: new Date().toISOString(),
    };

    persist({
      ...data, inventory, transactions, suppliers,
      purchaseInvoices: data.purchaseInvoices.map(i => i.id === invoiceId ? { ...i, returns: [ret, ...(i.returns || [])] } : i),
    });

  function markAttendance(employeeId, payload) {
    // payload: { date, status } - upsert: replace any existing entry for the same date
    const emp = data.employees.find(e => e.id === employeeId);
    if (!emp) return;
    const attendance = emp.attendance || [];
    const filtered = attendance.filter(a => a.date !== payload.date);
    const newEntry = { id: uid(), date: payload.date, status: payload.status, notes: payload.notes || "", createdAt: new Date().toISOString() };
    persist({ ...data, employees: data.employees.map(e => e.id === employeeId ? { ...e, attendance: [newEntry, ...filtered] } : e) });
    showToast(payload.status === "present" ? "تم تسجيل الحضور" : "تم تسجيل الغياب");
  }

  function toggleTodayAttendance(employeeId) {
    const emp = data.employees.find(e => e.id === employeeId);
    if (!emp) return;
    const today = todayISO();
    const already = (emp.attendance || []).find(a => a.date === today && a.status === "present");
    if (already) {
      persist({ ...data, employees: data.employees.map(e => e.id === employeeId ? { ...e, attendance: e.attendance.filter(a => a.id !== already.id) } : e) });
      showToast("تم إلغاء تسجيل حضور اليوم");

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed || !parsed.settings || !Array.isArray(parsed.transactions)) {
          showToast("الملف غير صالح، تأكد إنه نسخة احتياطية صحيحة", "error");
          return;
        }
        delete parsed.__backupInfo;
        persist({ ...DEFAULT_DATA, ...parsed, settings: { ...DEFAULT_DATA.settings, ...parsed.settings } });

function LedgerLogModal({ title: modalTitle, log, currency, total, categories, suppliers, employees, partners, onClose, onAdd, onDeduct, onDelete }) {
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [type, setType] = useState("add");
  const [notes, setNotes] = useState("");
  const [purpose, setPurpose] = useState("none");
  const [category, setCategory] = useState("");
  const [title, setTitle] = useState("");
  const [supplierId, setSupplierId] = useState("");
  const [employeeId, setEmployeeId] = useState("");
  const [partnerId, setPartnerId] = useState("");
  const [person, setPerson] = useState("");
  const [err, setErr] = useState("");

  function resetPurposeFields() { setPurpose("none"); setCategory(""); setTitle(""); setSupplierId(""); setEmployeeId(""); setPartnerId(""); setPerson(""); }

  function save() {
    const v = Number(amount);
    if (!v || v <= 0) return setErr("المبلغ يجب أن يكون أكبر من صفر");
    if (!date) return setErr("التاريخ مطلوب");

    if (type === "add") {
      onAdd({ type: "add", amount: v, date, notes: notes.trim() });
    } else {
      if (purpose === "expense" && !title.trim()) return setErr("اسم المصروف مطلوب");
      if (purpose === "supplier" && !supplierId) return setErr("اختر المندوب");
      if (purpose === "employee" && !employeeId) return setErr("اختر الموظف");
      if (purpose === "withdraw" && !partnerId && !person.trim()) return setErr("حدد اسم الشخص أو اختر شريك");
      onDeduct({ purpose, amount: v, date, notes: notes.trim(), category, title: title.trim(), supplierId, employeeId, partnerId, person: person.trim() });
    }
    setAmount(""); setNotes(""); setErr(""); resetPurposeFields();
  }

  return (
    <Sheet onClose={onClose} title={modalTitle}>
      <div className="bg-slate-50 rounded-xl p-3 mb-4 flex items-center justify-between">
        <span className="text-xs text-slate-500">الإجمالي الحالي</span>
        <span className="text-lg font-bold num">{fmt(total)} {currency}</span>
      </div>

      <div className="mb-4">
        <div className="text-xs text-slate-400 mb-1.5">إضافة قيد جديد</div>
        <div className="flex gap-2 mb-2">
          <button onClick={() => { setType("add"); resetPurposeFields(); }} className={`flex-1 text-xs py-2 rounded-xl border font-medium ${type === "add" ? "bg-emerald-500 text-white border-emerald-500" : "border-slate-200 text-slate-600"}`}>＋ إضافة مبلغ</button>
          <button onClick={() => setType("deduct")} className={`flex-1 text-xs py-2 rounded-xl border font-medium ${type === "deduct" ? "bg-red-500 text-white border-red-500" : "border-slate-200 text-slate-600"}`}>− خصم مبلغ</button>
        </div>

        {type === "deduct" && (
          <div className="mb-2">
            <div className="text-[11px] text-slate-400 mb-1">هذا الخصم مقابل:</div>
            <select value={purpose} onChange={e => setPurpose(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none mb-2">
              <option value="none">بدون ربط (خصم عام فقط)</option>
              <option value="expense">مصروف (يسجل بدفتر العمليات)</option>
              {suppliers.length > 0 && <option value="supplier">تسديد لمندوب</option>}
              {employees.length > 0 && <option value="employee">دفعة راتب موظف</option>}
              <option value="withdraw">سحب شخصي</option>
            </select>

            {purpose === "expense" && (
              <>
                <input value={title} onChange={e => setTitle(e.target.value)} placeholder="اسم المصروف" className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none mb-2" />
                <select value={category} onChange={e => setCategory(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2 px-2 text-xs outline-none mb-2">
                  <option value="">بدون تصنيف</option>
                  {categories.expense.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </>
            )}
            {purpose === "supplier" && (
              <select value={supplierId} onChange={e => setSupplierId(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none mb-2">
                <option value="">اختر مندوب</option>
                {suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            )}
            {purpose === "employee" && (
              <select value={employeeId} onChange={e => setEmployeeId(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none mb-2">
                <option value="">اختر موظف</option>
                {employees.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}
              </select>
            )}
            {purpose === "withdraw" && (
              <>
                {partners.length > 0 && (
                  <select value={partnerId} onChange={e => { setPartnerId(e.target.value); setPerson(""); }} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none mb-2">
                    <option value="">اختر شريك أو اكتب اسم بالأسفل</option>
                    {partners.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                )}
                {!partnerId && <input value={person} onChange={e => setPerson(e.target.value)} placeholder="اسم الشخص" className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none mb-2" />}
              </>
            )}
          </div>
        )}

        <div className="flex gap-2 mb-2">
          <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder={`المبلغ (${currency})`} className="flex-1 bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none num" />
          <input type="date" value={date} onChange={e => setDate(e.target.value)} className="flex-1 bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" />
        </div>
        <input value={notes} onChange={e => setNotes(e.target.value)} placeholder="ملاحظات (اختياري)" className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none mb-2" />
        {err && <div className="text-red-500 text-xs mb-2">{err}</div>}
        <button onClick={save} className="w-full bg-slate-800 text-white rounded-xl py-2.5 text-sm font-semibold">حفظ القيد</button>
      </div>

      <div className="text-xs text-slate-400 mb-1.5">السجل ({log.length})</div>
      {log.length === 0 ? (
        <div className="text-center text-slate-400 text-xs py-6">لا توجد قيود بعد</div>
      ) : (
        <div className="divide-y divide-slate-100">
          {log.map(e => {
            const meta = LEDGER_KIND_META[e.kind] || LEDGER_KIND_META.manual;
            return (
              <div key={e.id} className="flex items-center justify-between py-2.5 gap-2">
                <div className="w-8 h-8 rounded-full flex items-center justify-center shrink-0 text-sm" style={{ background: meta.color + "1A" }}>{meta.icon}</div>
                <div className="flex-1 min-w-0">
                  <div className="text-xs font-medium truncate">{e.notes || meta.label}</div>
                  <div className="text-[10px] text-slate-400">{e.date} · {meta.label}</div>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <span className={`text-xs font-bold num ${e.type === "deduct" ? "text-red-500" : "text-emerald-600"}`}>{e.type === "deduct" ? "-" : "+"}{fmt(e.amount)}</span>
                  <button onClick={() => onDelete(e.id)} className="text-slate-300 hover:text-red-500 text-xs">🗑</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </Sheet>
  );
}

function QuickDailyModal({ data, onClose, onSave }) {

  const [salesAmount, setSalesAmount] = useState("");
  const [salesCategory, setSalesCategory] = useState("");
  const [salesNotes, setSalesNotes] = useState("");
  const [expenses, setExpenses] = useState([{ amount: "", category: "", notes: "", paymentSource: "none" }]);
  const [supplierPayments, setSupplierPayments] = useState([{ supplierId: "", amount: "", paymentSource: "none" }]);
  const [employeePayments, setEmployeePayments] = useState([{ employeeId: "", amount: "", paymentSource: "none" }]);
  const [cashToday, setCashToday] = useState("");
  const [networkToday, setNetworkToday] = useState("");
  const [err, setErr] = useState("");

  function updateExpense(idx, patch) { setExpenses(expenses.map((e, i) => i === idx ? { ...e, ...patch } : e)); }
  function addExpenseRow() { setExpenses([...expenses, { amount: "", category: "", notes: "", paymentSource: "none" }]); }
  function removeExpenseRow(idx) { setExpenses(expenses.filter((_, i) => i !== idx)); }

  function updateSupplier(idx, patch) { setSupplierPayments(supplierPayments.map((s, i) => i === idx ? { ...s, ...patch } : s)); }
  function addSupplierRow() { setSupplierPayments([...supplierPayments, { supplierId: "", amount: "", paymentSource: "none" }]); }
  function removeSupplierRow(idx) { setSupplierPayments(supplierPayments.filter((_, i) => i !== idx)); }

  function updateEmployee(idx, patch) { setEmployeePayments(employeePayments.map((e, i) => i === idx ? { ...e, ...patch } : e)); }
  function addEmployeeRow() { setEmployeePayments([...employeePayments, { employeeId: "", amount: "", paymentSource: "none" }]); }
  function removeEmployeeRow(idx) { setEmployeePayments(employeePayments.filter((_, i) => i !== idx)); }

  function save() {
    if (!date) return setErr("التاريخ مطلوب");
    const validExpenses = expenses.filter(e => Number(e.amount) > 0);
    const validSuppliers = supplierPayments.filter(s => s.supplierId && Number(s.amount) > 0);
    const validEmployees = employeePayments.filter(e => e.employeeId && Number(e.amount) > 0);
    const hasAny = Number(salesAmount) > 0 || validExpenses.length > 0 || validSuppliers.length > 0 || validEmployees.length > 0 || Number(networkToday) > 0 || (cashToday !== "" && cashToday != null);
    if (!hasAny) return setErr("عبّي خانة وحدة على الأقل");
    onSave({
      date, salesAmount, salesCategory, salesNotes, salesTitle: `مبيعات يوم ${date}`,
      expenses: validExpenses, supplierPayments: validSuppliers, employeePayments: validEmployees, cashToday, networkToday,

function Ledger({ data, onEdit, onDelete, onExport }) {
  const [q, setQ] = useState("");
  const [typeFilter, setTypeFilter] = useState("all");
  const [catFilter, setCatFilter] = useState("all");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const allCats = useMemo(() => [...new Set([...data.categories.income, ...data.categories.expense])], [data.categories]);

  const filtered = useMemo(() => data.transactions.filter(t => {
    if (typeFilter !== "all" && t.type !== typeFilter) return false;
    if (catFilter !== "all" && t.category !== catFilter) return false;
    if (from && t.date < from) return false;
    if (to && t.date > to) return false;
    if (q) {
      const name = (t.type === "withdraw" ? t.person : t.title) || "";
      const hay = (name + " " + (t.notes || "") + " " + (t.category || "")).toLowerCase();
      if (!hay.includes(q.toLowerCase())) return false;

    return true;
  }), [data.transactions, q, typeFilter, catFilter, from, to]);

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <div className="font-bold text-lg">دفتر العمليات</div>
        <button onClick={onExport} className="flex items-center gap-1 text-xs bg-white border border-slate-200 rounded-full px-3 py-1.5 text-slate-600">⬇ تصدير CSV</button>
      </div>
      <div className="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 space-y-2">
        <div className="relative">
          <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="بحث..." className="w-full bg-slate-50 rounded-xl py-2 pr-9 pl-3 text-sm outline-none" />
        </div>
        <div className="flex gap-2 overflow-x-auto pb-1">
          {[["all", "الكل"], ["income", "إيراد"], ["expense", "مصروف"], ["withdraw", "سحب"]].map(([v, l]) => (
            <button key={v} onClick={() => setTypeFilter(v)} className={`shrink-0 text-xs px-3 py-1.5 rounded-full border ${typeFilter === v ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-200"}`}>{l}</button>
          ))}
        </div>
        <select value={catFilter} onChange={e => setCatFilter(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2 px-2 text-xs outline-none">
          <option value="all">كل التصنيفات</option>
          {allCats.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <div className="flex gap-2">
          <input type="date" value={from} onChange={e => setFrom(e.target.value)} className="flex-1 bg-slate-50 rounded-xl py-2 px-2 text-xs outline-none" />
          <input type="date" value={to} onChange={e => setTo(e.target.value)} className="flex-1 bg-slate-50 rounded-xl py-2 px-2 text-xs outline-none" />
        </div>
      </div>
      <div className="bg-white rounded-2xl p-3 shadow-sm border border-slate-100">
        {filtered.length === 0 ? (
          <div className="text-center text-slate-400 text-sm py-8">لا توجد نتائج مطابقة</div>
        ) : (
          <div className="divide-y divide-slate-100">
            {filtered.map(t => <TxRow key={t.id} t={t} onClick={() => onEdit(t)} onEdit={onEdit} onDelete={onDelete} />)}
          </div>
        )}
      </div>
    </div>
  );
}

function TrendChart({ points }) {
  const W = 320, H = 160, PAD = 20;
  const maxVal = Math.max(1, ...points.flatMap(p => [p.income, p.expense, Math.abs(p.net)]));
  const stepX = (W - PAD * 2) / Math.max(1, points.length - 1);
  function toXY(v, i) {
    const x = PAD + i * stepX;
    const y = H - PAD - (v / maxVal) * (H - PAD * 2);
    return [x, y];
  }
  function pathFor(key) {
    return points.map((p, i) => { const [x, y] = toXY(p[key], i); return (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1); }).join(" ");
  }
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-40">
        <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke="#E6EBE9" strokeWidth="1" />
        <path d={pathFor("income")} fill="none" stroke="#146350" strokeWidth="2" />
        <path d={pathFor("expense")} fill="none" stroke="#A84A34" strokeWidth="2" />
        <path d={pathFor("net")} fill="none" stroke="#285070" strokeWidth="2" />
      </svg>
      <div className="flex items-center gap-4 justify-center text-[11px] text-slate-500 mt-1">
        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ background: "#146350" }}></span>إيرادات</span>

function ObligationCard({ o, currency, onEdit, onDelete, onAdjust, onReset }) {
  const [amount, setAmount] = useState("");
  const target = Number(o.target || 0);
  const collected = Number(o.collected || 0);
  const pct = target > 0 ? Math.min(100, Math.round((collected / target) * 100)) : 0;
  const remaining = Math.max(0, target - collected);
  const done = target > 0 && collected >= target;
  function apply(sign) { const v = Number(amount); if (!v || v <= 0) return; onAdjust(sign * v); setAmount(""); }

  return (
    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
      <div className="flex items-start justify-between mb-2">
        <div><div className="font-semibold text-sm">{o.name}</div>{o.notes && <div className="text-[11px] text-slate-400">{o.notes}</div>}</div>
        <div className="flex items-center gap-1">
          <button onClick={onEdit} className="p-1.5 text-slate-400 hover:text-slate-700">✎</button>
          <button onClick={onDelete} className="p-1.5 text-slate-400 hover:text-red-500">🗑</button>
        </div>
      </div>
      <div className="text-xs text-slate-500 mb-1.5">جمعت <span className="font-bold num text-slate-800">{fmt(collected)}</span> من أصل <span className="font-bold num text-slate-800">{fmt(target)}</span> {currency}</div>
      <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden mb-1.5">
        <div className="h-full rounded-full" style={{ width: `${pct}%`, background: done ? "#146350" : "#285070" }} />
      </div>
      <div className="flex items-center justify-between text-[11px] text-slate-400 mb-3">
        <span>{pct}%</span><span>{done ? "مكتمل ✓" : `متبقي ${fmt(remaining)} ${currency}`}</span>
      </div>
      <div className="flex items-center gap-2">
        <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="المبلغ" className="flex-1 bg-slate-50 rounded-xl py-2 px-3 text-sm outline-none num" />
        <button onClick={() => apply(1)} className="w-9 h-9 shrink-0 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold">＋</button>
        <button onClick={() => apply(-1)} className="w-9 h-9 shrink-0 rounded-xl bg-red-50 text-red-500 flex items-center justify-center font-bold">−</button>
      </div>
      <button onClick={onReset} className="text-[11px] text-slate-400 mt-2">تصفير لبداية شهر جديد</button>
    </div>
  );
}

function ObligationModal({ initial, currency, onClose, onSave }) {
  const [name, setName] = useState(initial.name || "");
  const [target, setTarget] = useState(initial.target ?? "");
  const [collected, setCollected] = useState(initial.collected ?? "");
  const [notes, setNotes] = useState(initial.notes || "");
  const [err, setErr] = useState("");
  function save() {
    if (!name.trim()) return setErr("اسم الالتزام مطلوب");
    if (target === "" || Number(target) < 0) return setErr("المبلغ المستهدف مطلوب");
    onSave({ id: initial.id, name: name.trim(), target: Number(target), collected: Number(collected || 0), notes: notes.trim() });
  }
  return (
    <Sheet onClose={onClose} title={initial.id ? "تعديل التزام" : "إضافة التزام ثابت"}>
      <Field label="اسم الالتزام (مثل: إيجار المحل، رواتب)"><input value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
      <Field label={`المبلغ المستهدف شهريًا (${currency})`}><input type="number" value={target} onChange={e => setTarget(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none num" /></Field>
      <Field label={`المبلغ المجمّع حاليًا (${currency})`}><input type="number" value={collected} onChange={e => setCollected(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none num" /></Field>
      <Field label="ملاحظات"><textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none resize-none" /></Field>
      {err && <div className="text-red-500 text-xs mb-2">{err}</div>}
      <button onClick={save} className="w-full bg-slate-800 text-white rounded-xl py-3 text-sm font-semibold">حفظ</button>

  );
}

function Partners({ data, totals, onSave, onDelete }) {

  function withdrawnBy(partner) {

      t.partnerId ? t.partnerId === partner.id : (t.person || "").trim().toLowerCase() === partner.name.trim().toLowerCase()

        <div className="bg-white rounded-2xl p-6 text-center text-slate-400 text-sm border border-slate-100">لا يوجد شركاء مضافون بعد</div>

                  <div className="flex items-center gap-1">

                    <button onClick={() => onDelete(p.id)} className="p-2 text-slate-400 hover:text-red-500">🗑</button>
                  </div>
                </div>
                {withdrawn > 0 && (
                  <div className="text-[11px] text-amber-600 mt-1.5">سحب حتى الآن: <span className="font-bold num">{fmt(withdrawn)}</span> {data.settings.currency}</div>
                )}
              </div>
            );
          })}
          {totalPct > 0 && (

          )}

      {data.partners.length > 0 && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
          <div className="font-semibold text-sm">محاكاة تقسيم الأرباح</div>
          <div className="flex gap-2">
            <button onClick={() => setSplitBase("net")} className={`flex-1 text-xs py-1.5 rounded-lg border ${splitBase === "net" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>صافي الربح المتجمع</button>
            <button onClick={() => setSplitBase("custom")} className={`flex-1 text-xs py-1.5 rounded-lg border ${splitBase === "custom" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>مبلغ مخصص</button>
          </div>
          {splitBase === "custom" && <input type="number" value={customAmount} onChange={e => setCustomAmount(e.target.value)} placeholder="أدخل المبلغ" className="w-full bg-slate-50 rounded-xl py-2 px-3 text-sm outline-none" />}
          <div className="text-xs text-slate-400">المبلغ المستخدم للتقسيم: <span className="font-semibold num text-slate-700">{fmt(baseAmount)} {data.settings.currency}</span></div>
          <div className="divide-y divide-slate-100">
            {data.partners.map(p => {
              const share = baseAmount * (Number(p.percentage || 0) / 100);
              const withdrawn = withdrawnBy(p);
              const remaining = share - withdrawn;
              return (
                <div key={p.id} className="py-2">
                  <div className="flex items-center justify-between text-sm mb-1">
                    <span>{p.name} <span className="text-slate-400 text-xs">({p.percentage || 0}%)</span></span>

function SellModal({ device, currency, onClose, onSave, onUpdate }) {

  const [buyerName, setBuyerName] = useState(device.buyerName || "");

  const [notes, setNotes] = useState(alreadySold ? (device.notes || "") : "");
  const [err, setErr] = useState("");

  function save() {
    const sp = Number(salePrice);
    if (!sp || sp <= 0) return setErr("سعر البيع يجب أن يكون أكبر من صفر");

function DailyClosing({ data, totals, onSaveClosing, exportDayCSV }) {
  const [date, setDate] = useState(todayISO());
  const dayTx = useMemo(() => data.transactions.filter(t => t.date === date), [data.transactions, date]);
  const income = dayTx.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0);
  const expense = dayTx.filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0);
  const withdraw = dayTx.filter(t => t.type === "withdraw").reduce((s, t) => s + t.amount, 0);
  const net = income - expense;

  const openingBalance = useMemo(() => {
    let bal = Number(data.settings.initialBalance || 0);
    for (const t of data.transactions) {
      if (t.date >= date) continue;
      if (t.type === "income") bal += t.amount;
      else if (t.type === "expense") bal -= t.amount;
      else if (t.type === "withdraw") bal -= t.amount;
    }
    return bal;
  }, [data.transactions, data.settings.initialBalance, date]);
  const closingBalance = openingBalance + income - expense - withdraw;

  const existing = data.closings.find(c => c.date === date);
  const [copied, setCopied] = useState(false);

  function save() {
    onSaveClosing({ date, openingBalance, income, expense, withdraw, net, closingBalance, txCount: dayTx.length });
  }

  function copyText() {
    const text = buildClosingText(data.settings.shopName, date, openingBalance, closingBalance, income, expense, withdraw, net, dayTx, data.settings.currency);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
    } else {
      window.prompt("انسخ النص التالي يدويًا:", text);
    }
  }

  function printAsDocument() {
    printClosing(data.settings.shopName, date, openingBalance, closingBalance, income, expense, withdraw, net, dayTx, data.settings.currency);
  }

  return (

function InventoryCard({ i, currency, onEdit, onDelete, onAdjust }) {
  const [amount, setAmount] = useState("");
  const low = Number(i.minQty || 0) > 0 && Number(i.quantity || 0) <= Number(i.minQty);
  function apply(sign) { const v = Number(amount); if (!v || v <= 0) return; onAdjust(sign * v); setAmount(""); }

  return (
    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
      <div className="flex items-start justify-between mb-2">
        <div>
          <div className="font-semibold text-sm flex items-center gap-2">{i.name}{low && <span className="text-[10px] bg-red-50 text-red-500 px-2 py-0.5 rounded-full">وشك يخلص</span>}</div>
          {i.category && <div className="text-[11px] text-slate-400">{i.category}</div>}
        </div>
        <div className="flex items-center gap-1">
          <button onClick={onEdit} className="p-1.5 text-slate-400 hover:text-slate-700">✎</button>
          <button onClick={onDelete} className="p-1.5 text-slate-400 hover:text-red-500">🗑</button>
        </div>
      </div>
      <div className="flex items-center justify-between text-xs text-slate-500 mb-3">
        <span>الكمية الحالية: <span className="font-bold num text-slate-800">{fmt(i.quantity)}</span></span>
        <span>سعر التكلفة: <span className="font-bold num text-slate-800">{fmt(i.unitCost)}</span> {currency}</span>
      </div>
      <div className="flex items-center gap-2">
        <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="الكمية" className="flex-1 bg-slate-50 rounded-xl py-2 px-3 text-sm outline-none num" />
        <button onClick={() => apply(1)} className="w-9 h-9 shrink-0 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold">＋</button>
        <button onClick={() => apply(-1)} className="w-9 h-9 shrink-0 rounded-xl bg-red-50 text-red-500 flex items-center justify-center font-bold">−</button>
      </div>
    </div>
  );
}
