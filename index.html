function ReturnModal({ invoice, currency, onClose, onSave }) {
  const [date, setDate] = useState(todayISO());
  const [items, setItems] = useState(invoice.items.map(it => ({ name: it.name, maxQty: it.qty, unitCost: it.unitCost, qty: "" })));
  const [notes, setNotes] = useState("");
  const [err, setErr] = useState("");

  function updateItem(idx, patch) { setItems(items.map((it, i) => i === idx ? { ...it, ...patch } : it)); }
  const total = items.reduce((s, it) => s + (Number(it.qty) || 0) * Number(it.unitCost), 0);

  function save() {
    const valid = items.filter(it => Number(it.qty) > 0);
    if (valid.length === 0) return setErr("حدد كمية الرجيع لصنف واحد على الأقل");
    for (const it of valid) {
      if (Number(it.qty) > Number(it.maxQty)) return setErr(`كمية الرجيع لـ "${it.name}" أكبر من الكمية المشتراة`);
    }
    if (!date) return setErr("التاريخ مطلوب");
    onSave({ date, items: valid, notes: notes.trim() });
  }

  return (
    <Sheet onClose={onClose} title={`تسجيل رجيع — فاتورة #${invoice.invoiceNo}`}>
      <Field label="تاريخ الرجيع"><input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
      <div className="text-xs text-slate-400 mb-1.5">حدد الكمية المرتجعة من كل صنف</div>
      <div className="space-y-2 mb-3">
        {items.map((it, idx) => (
          <div key={idx} className="flex items-center gap-2 bg-slate-50 rounded-xl p-2">
            <span className="flex-[1.5] text-xs">{it.name} <span className="text-slate-400">(اشتريت {it.maxQty})</span></span>
            <input type="number" value={it.qty} onChange={e => updateItem(idx, { qty: e.target.value })} placeholder="0" className="flex-1 bg-white rounded-lg py-1.5 px-2 text-xs outline-none num" />
          </div>
        ))}
      </div>
      <Field label="ملاحظات (سبب الرجيع)"><textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none resize-none" /></Field>
      <div className="text-sm mb-2">إجمالي الرجيع: <span className="font-bold num">{fmt(total)} {currency}</span></div>
      <div className="text-[11px] text-slate-400 mb-2">
        {invoice.paymentType === "cash" ? "بيتسجل كإيراد (مرتجع مشتريات) بدفتر العمليات." : "بينخصم من دين المورد المرتبط بهذه الفاتورة (مو تسديد، بل رجيع بضاعة)."}
      </div>
      {err && <div className="text-red-500 text-xs mb-2">{err}</div>}
      <button onClick={save} className="w-full bg-amber-500 text-white rounded-xl py-3 text-sm font-semibold">حفظ الرجيع</button>
    </Sheet>
  );
}

function InvoiceModal({ data, onClose, onSave }) {
  const [supplierId, setSupplierId] = useState("");
  const [supplierName, setSupplierName] = useState("");
  const [date, setDate] = useState(todayISO());
  const [paymentType, setPaymentType] = useState("cash");
  const [notes, setNotes] = useState("");
  const [items, setItems] = useState([{ name: "", qty: "", unitCost: "" }]);
  const [err, setErr] = useState("");

  const total = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.unitCost) || 0), 0);

  function updateItem(idx, patch) { setItems(items.map((it, i) => i === idx ? { ...it, ...patch } : it)); }
  function addRow() { setItems([...items, { name: "", qty: "", unitCost: "" }]); }
  function removeRow(idx) { setItems(items.filter((_, i) => i !== idx)); }

  function save() {
    const validItems = items.filter(it => it.name.trim() && Number(it.qty) > 0);
    if (validItems.length === 0) return setErr("أضف صنف واحد على الأقل بكمية أكبر من صفر");
    if (!date) return setErr("التاريخ مطلوب");
    if (paymentType === "credit" && !supplierId) return setErr("اختر المورد عشان يتسجل الدين عليه");
    const supplier = data.suppliers.find(s => s.id === supplierId);
    onSave({ supplierId: supplierId || null, supplierName: supplier ? supplier.name : supplierName.trim(), date, paymentType, notes: notes.trim(), items: validItems });
  }

  return (
    <Sheet onClose={onClose} title="فاتورة مشتريات جديدة">
      <Field label="المورد (اختياري)">
        <select value={supplierId} onChange={e => { setSupplierId(e.target.value); setSupplierName(""); }} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none">
          <option value="">بدون مورد محدد</option>
          {data.suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </Field>
      {!supplierId && (
        <Field label="اسم المورد (نص حر، اختياري)"><input value={supplierName} onChange={e => setSupplierName(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
      )}
      <Field label="تاريخ الفاتورة"><input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>

      <div className="text-xs text-slate-400 mb-1.5">الأصناف</div>
      <div className="space-y-2 mb-2">
        {items.map((it, idx) => (
          <div key={idx} className="flex items-center gap-1.5">
            <input value={it.name} onChange={e => updateItem(idx, { name: e.target.value })} placeholder="اسم الصنف" list="inv-items" className="flex-[2] bg-slate-50 rounded-xl py-2 px-2 text-xs outline-none" />
            <input type="number" value={it.qty} onChange={e => updateItem(idx, { qty: e.target.value })} placeholder="الكمية" className="flex-1 bg-slate-50 rounded-xl py-2 px-2 text-xs outline-none num" />
            <input type="number" value={it.unitCost} onChange={e => updateItem(idx, { unitCost: e.target.value })} placeholder="السعر" className="flex-1 bg-slate-50 rounded-xl py-2 px-2 text-xs outline-none num" />
            {items.length > 1 && <button onClick={() => removeRow(idx)} className="text-red-400 px-1">✕</button>}
          </div>
        ))}
        <datalist id="inv-items">{data.inventory.map(i => <option key={i.id} value={i.name} />)}</datalist>
      </div>
      <button onClick={addRow} className="text-xs text-slate-500 mb-3">＋ إضافة صنف آخر</button>

      <Field label="طريقة الدفع">
        <div className="flex gap-2">
          <button onClick={() => setPaymentType("cash")} className={`flex-1 text-xs py-2 rounded-xl border font-medium ${paymentType === "cash" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>نقدي (يسجل كمصروف)</button>
          <button onClick={() => setPaymentType("credit")} className={`flex-1 text-xs py-2 rounded-xl border font-medium ${paymentType === "credit" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>على الحساب (دين على المورد)</button>
        </div>
      </Field>
      <Field label="ملاحظات"><textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none resize-none" /></Field>

      <div className="text-sm mb-2">الإجمالي: <span className="font-bold num">{fmt(total)} {data.settings.currency}</span></div>
      {err && <div className="text-red-500 text-xs mb-2">{err}</div>}
      <button onClick={save} className="w-full bg-slate-800 text-white rounded-xl py-3 text-sm font-semibold">حفظ الفاتورة</button>
    </Sheet>
  );
}

function Employees({ data, onSave, onDelete, onAddPayment, onDeletePayment, onToggleToday, onMarkAttendance, onDeleteAttendance }) {
  const [form, setForm] = useState(null);
  const [payFor, setPayFor] = useState(null);
  const [attendFor, setAttendFor] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [expandedAttendance, setExpandedAttendance] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const curMonth = todayISO().slice(0, 7);
  const today = todayISO();

  function paidThisMonth(emp) {
    return emp.entries.filter(e => e.date.slice(0, 7) === curMonth).reduce((s, e) => s + e.amount, 0);
  }
  function attendanceThisMonth(emp) {
    return (emp.attendance || []).filter(a => a.date.slice(0, 7) === curMonth && a.status === "present").length;
  }
  function absencesThisMonth(emp) {
    return (emp.attendance || []).filter(a => a.date.slice(0, 7) === curMonth && a.status === "absent").length;
  }

  const totalRemaining = data.employees.reduce((s, e) => s + Math.max(0, Number(e.monthlySalary || 0) - paidThisMonth(e)), 0);

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div className="font-bold text-lg">الموظفين</div>
        <button onClick={() => setForm({ name: "", phone: "", monthlySalary: "", notes: "" })} className="flex items-center gap-1 text-xs bg-slate-800 text-white rounded-full px-3 py-1.5">＋ إضافة موظف</button>
      </div>

      {data.employees.length > 0 && (
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
          <div>
            <div className="text-xs text-slate-400 mb-1">إجمالي المتبقي لكل الموظفين هذا الشهر</div>
            <div className="text-lg font-bold num">{fmt(totalRemaining)} {data.settings.currency}</div>
          </div>
          <span className="text-2xl">🧑‍🔧</span>
        </div>
      )}

      {data.employees.length === 0 ? (
        <div className="bg-white rounded-2xl p-6 text-center text-slate-400 text-sm border border-slate-100">لا يوجد موظفين مضافين بعد</div>
      ) : (
        <div className="space-y-3">
          {data.employees.map(emp => {
            const paid = paidThisMonth(emp);
            const salary = Number(emp.monthlySalary || 0);
            const remaining = salary - paid;
            const pct = salary > 0 ? Math.min(100, Math.round((paid / salary) * 100)) : 0;
            const open = expanded === emp.id;
            const attOpen = expandedAttendance === emp.id;
            const presentDays = attendanceThisMonth(emp);
            const absentDays = absencesThisMonth(emp);
            const attendedToday = (emp.attendance || []).some(a => a.date === today && a.status === "present");
            const attendance = (emp.attendance || []).slice().sort((a, b) => b.date.localeCompare(a.date));
            return (
              <div key={emp.id} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <div className="flex items-start justify-between mb-2">
                  <div>
                    <div className="font-semibold text-sm">{emp.name}</div>
                    <div className="text-[11px] text-slate-400">{emp.phone}{emp.notes ? " · " + emp.notes : ""}</div>
                  </div>
                  <div className="flex items-center gap-1">
                    <button onClick={() => setForm(emp)} className="p-1.5 text-slate-400 hover:text-slate-700">✎</button>
                    <button onClick={() => setConfirmDel(emp)} className="p-1.5 text-slate-400 hover:text-red-500">🗑</button>
                  </div>
                </div>

                <div className="text-xs text-slate-500 mb-1.5">
                  أخذ <span className="font-bold num text-slate-800">{fmt(paid)}</span> من راتب <span className="font-bold num text-slate-800">{fmt(salary)}</span> {data.settings.currency} هذا الشهر
                </div>
                <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden mb-1.5">
                  <div className="h-full rounded-full" style={{ width: `${pct}%`, background: remaining <= 0 ? "#146350" : "#285070" }} />
                </div>
                <div className="flex items-center justify-between text-[11px] text-slate-400 mb-3">
                  <span>{pct}%</span>
                  <span className={remaining < 0 ? "text-red-500 font-semibold" : ""}>{remaining >= 0 ? `باقي له ${fmt(remaining)} ${data.settings.currency}` : `أخذ زيادة ${fmt(-remaining)} ${data.settings.currency}`}</span>
                </div>

                <div className="bg-slate-50 rounded-xl p-2.5 mb-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[11px] text-slate-500">📅 دوام هذا الشهر: <span className="font-bold num text-emerald-600">{presentDays}</span> يوم{absentDays > 0 ? <span> · غياب: <span className="font-bold num text-red-500">{absentDays}</span></span> : null}</span>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => onToggleToday(emp.id)} className={`flex-1 text-xs py-2 rounded-xl font-semibold ${attendedToday ? "bg-emerald-500 text-white" : "bg-white border border-slate-200 text-slate-600"}`}>
                      {attendedToday ? "✓ حضر اليوم" : "تسجيل حضور اليوم"}
                    </button>
                    <button onClick={() => setAttendFor(emp)} className="px-3 bg-white border border-slate-200 rounded-xl text-xs text-slate-500">📆</button>
                  </div>
                  <button onClick={() => setExpandedAttendance(attOpen ? null : emp.id)} className="text-[11px] text-slate-400 mt-2">{attOpen ? "إخفاء سجل الدوام ▲" : "عرض سجل الدوام ▼"}</button>
                  {attOpen && (
                    <div className="mt-2 divide-y divide-slate-200 bg-white rounded-lg">
                      {attendance.length === 0 ? (
                        <div className="text-center text-slate-400 text-xs py-3">لا يوجد سجل دوام بعد</div>
                      ) : attendance.map(a => (
                        <div key={a.id} className="flex items-center justify-between px-2 py-1.5">
                          <span className="text-[11px]">{a.date}{a.notes ? " · " + a.notes : ""}</span>
                          <div className="flex items-center gap-2">
                            <span className={`text-[10px] px-2 py-0.5 rounded-full ${a.status === "present" ? "bg-emerald-50 text-emerald-600" : "bg-red-50 text-red-500"}`}>{a.status === "present" ? "حاضر" : "غائب"}</span>
                            <button onClick={() => onDeleteAttendance(emp.id, a.id)} className="text-slate-300 hover:text-red-500 text-xs">🗑</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <button onClick={() => setPayFor(emp)} className="w-full bg-slate-800 text-white rounded-xl py-2 text-xs font-semibold mb-2">＋ تسجيل دفعة من الراتب</button>
                <button onClick={() => setExpanded(open ? null : emp.id)} className="text-[11px] text-slate-400">{open ? "إخفاء سجل الدفعات ▲" : "عرض سجل الدفعات ▼"}</button>
                {open && (
                  <div className="mt-2 divide-y divide-slate-100 bg-slate-50 rounded-xl">
                    {emp.entries.length === 0 ? (
                      <div className="text-center text-slate-400 text-xs py-4">لا توجد دفعات مسجلة بعد</div>
                    ) : emp.entries.map(e => (
                      <div key={e.id} className="flex items-center justify-between px-3 py-2">
                        <div>
                          <div className="text-xs font-medium">{e.date}{e.notes ? " · " + e.notes : ""}</div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-bold num text-slate-700">{fmt(e.amount)}</span>
                          <button onClick={() => onDeletePayment(emp.id, e.id)} className="text-slate-300 hover:text-red-500 text-xs">🗑</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {form && <EmployeeModal initial={form} onClose={() => setForm(null)} onSave={(p) => { onSave(p); setForm(null); }} />}
      {payFor && (
        <EmployeePaymentModal employee={payFor} currency={data.settings.currency} onClose={() => setPayFor(null)} onSave={(entry) => { onAddPayment(payFor.id, entry); setPayFor(null); }} />
      )}
      {attendFor && (
        <AttendanceModal employee={attendFor} onClose={() => setAttendFor(null)} onSave={(payload) => { onMarkAttendance(attendFor.id, payload); setAttendFor(null); }} />
      )}
      {confirmDel && (
        <ConfirmModal title="حذف الموظف" message={`سيتم حذف "${confirmDel.name}" وكل سجل دفعاته من دفتر العمليات. متابعة؟`}
          onCancel={() => setConfirmDel(null)} onConfirm={() => { onDelete(confirmDel.id); setConfirmDel(null); }} />
      )}
    </div>
  );
}

function AttendanceModal({ employee, onClose, onSave }) {
  const [date, setDate] = useState(todayISO());
  const [status, setStatus] = useState("present");
  const [notes, setNotes] = useState("");
  const [err, setErr] = useState("");
  function save() {
    if (!date) return setErr("التاريخ مطلوب");
    onSave({ date, status, notes: notes.trim() });
  }
  return (
    <Sheet onClose={onClose} title={`تسجيل دوام — ${employee.name}`}>
      <Field label="التاريخ"><input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
      <Field label="الحالة">
        <div className="flex gap-2">
          <button type="button" onClick={() => setStatus("present")} className={`flex-1 text-xs py-2 rounded-xl border font-medium ${status === "present" ? "bg-emerald-500 text-white border-emerald-500" : "border-slate-200 text-slate-600"}`}>✓ حاضر</button>
          <button type="button" onClick={() => setStatus("absent")} className={`flex-1 text-xs py-2 rounded-xl border font-medium ${status === "absent" ? "bg-red-500 text-white border-red-500" : "border-slate-200 text-slate-600"}`}>✕ غائب</button>
        </div>
      </Field>
      <Field label="ملاحظات (اختياري، مثل: إجازة مرضية)"><input value={notes} onChange={e => setNotes(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
      {err && <div className="text-red-500 text-xs mb-2">{err}</div>}
      <button onClick={save} className="w-full bg-slate-800 text-white rounded-xl py-3 text-sm font-semibold">حفظ</button>
    </Sheet>
  );
}

function EmployeeModal({ initial, onClose, onSave }) {
  const [name, setName] = useState(initial.name || "");
  const [phone, setPhone] = useState(initial.phone || "");
  const [monthlySalary, setMonthlySalary] = useState(initial.monthlySalary ?? "");
  const [notes, setNotes] = useState(initial.notes || "");
  const [err, setErr] = useState("");
  function save() {
    if (!name.trim()) return setErr("اسم الموظف مطلوب");
    onSave({ id: initial.id, name: name.trim(), phone: phone.trim(), monthlySalary: Number(monthlySalary || 0), notes: notes.trim() });
  }
  return (
    <Sheet onClose={onClose} title={initial.id ? "تعديل موظف" : "إضافة موظف"}>
      <Field label="اسم الموظف"><input value={name} onChange={e => setName(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
      <Field label="رقم الجوال (اختياري)"><input value={phone} onChange={e => setPhone(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
      <Field label="الراتب الشهري"><input type="number" value={monthlySalary} onChange={e => setMonthlySalary(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none num" /></Field>
      <Field label="ملاحظات"><textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none resize-none" /></Field>
      {err && <div className="text-red-500 text-xs mb-2">{err}</div>}
      <button onClick={save} className="w-full bg-slate-800 text-white rounded-xl py-3 text-sm font-semibold">حفظ</button>
    </Sheet>
  );
}

function EmployeePaymentModal({ employee, currency, onClose, onSave }) {
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [notes, setNotes] = useState("");
  const [paymentSource, setPaymentSource] = useState("none");
  const [err, setErr] = useState("");
  function save() {
    const v = Number(amount);
    if (!v || v <= 0) return setErr("المبلغ يجب أن يكون أكبر من صفر");
    if (!date) return setErr("التاريخ مطلوب");
    onSave({ amount: v, date, notes: notes.trim(), paymentSource });
  }
  return (
    <Sheet onClose={onClose} title={`دفعة راتب — ${employee.name}`}>
      <Field label={`المبلغ (${currency})`}><input type="number" value={amount} onChange={e => setAmount(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none num" /></Field>
      <Field label="التاريخ"><input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
      <Field label="ملاحظات (اختياري)"><textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none resize-none" /></Field>
      <div className="mb-2">
        <div className="text-[11px] text-slate-400 mb-1">ادفعها من (اختياري)</div>
        <div className="grid grid-cols-2 gap-2">
          <button type="button" onClick={() => setPaymentSource("none")} className={`text-xs py-2 rounded-xl border font-medium ${paymentSource === "none" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>بدون ربط</button>
          <button type="button" onClick={() => setPaymentSource("cash")} className={`text-xs py-2 rounded-xl border font-medium ${paymentSource === "cash" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>💵 كاش</button>
          <button type="button" onClick={() => setPaymentSource("network")} className={`text-xs py-2 rounded-xl border font-medium ${paymentSource === "network" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>💳 شبكة</button>
          <button type="button" onClick={() => setPaymentSource("safe")} className={`text-xs py-2 rounded-xl border font-medium ${paymentSource === "safe" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>🔒 خزنة</button>
        </div>
      </div>
      <div className="text-[11px] text-slate-400 mb-2">بتتسجل هذي الدفعة تلقائيًا كمصروف (تصنيف: رواتب) بدفتر العمليات.</div>
      {err && <div className="text-red-500 text-xs mb-2">{err}</div>}
      <button onClick={save} className="w-full bg-slate-800 text-white rounded-xl py-3 text-sm font-semibold">حفظ الدفعة</button>
    </Sheet>
  );
}

function SettingsPage({ data, onUpdateSettings, onAddCategory, onRemoveCategory, onExportBackup, onImportBackup }) {
  const [shopName, setShopName] = useState(data.settings.shopName);
  const [currency, setCurrency] = useState(data.settings.currency);
  const [initialBalance, setInitialBalance] = useState(data.settings.initialBalance);
  const [newIncomeCat, setNewIncomeCat] = useState("");
  const [newExpenseCat, setNewExpenseCat] = useState("");
  const [confirmImport, setConfirmImport] = useState(null);
  const fileInputRef = useRef(null);

  function handleFilePicked(e) {
    const file = e.target.files[0];
    if (file) setConfirmImport(file);
    e.target.value = "";
  }

  return (
    <div className="space-y-4">
      <div className="font-bold text-lg">الإعدادات</div>
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <Field label="اسم المحل"><input value={shopName} onChange={e => setShopName(e.target.value)} onBlur={() => onUpdateSettings({ shopName })} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
        <Field label="العملة"><input value={currency} onChange={e => setCurrency(e.target.value)} onBlur={() => onUpdateSettings({ currency })} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
        <Field label="الرصيد الابتدائي"><input type="number" value={initialBalance} onChange={e => setInitialBalance(e.target.value)} onBlur={() => onUpdateSettings({ initialBalance: Number(initialBalance || 0) })} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none num" /></Field>
      </div>

      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div className="font-semibold text-sm mb-1">النسخ الاحتياطي</div>
        <div className="text-[11px] text-slate-400 mb-3">نزّل نسخة كاملة من كل بياناتك (عمليات، شركاء، أجهزة، مناديب، مخزون...) بملف واحد. احتفظ به بفلاشة أو ارفعه على جوجل درايف/آيكلاود عشان ما تفقد بياناتك لو صار شي بجهازك.</div>
        <div className="flex gap-2">
          <button onClick={onExportBackup} className="flex-1 bg-slate-800 text-white rounded-xl py-2.5 text-xs font-semibold">⬇ تنزيل نسخة احتياطية</button>
          <button onClick={() => fileInputRef.current.click()} className="flex-1 bg-white border border-slate-200 text-slate-600 rounded-xl py-2.5 text-xs font-semibold">⬆ استرجاع من ملف</button>
          <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={handleFilePicked} className="hidden" />
        </div>
        {confirmImport && (
          <div className="mt-3 bg-amber-50 rounded-xl p-3">
            <div className="text-xs text-amber-700 mb-2">⚠ استرجاع هذا الملف بيستبدل كل بياناتك الحالية بالكامل. متأكد؟</div>
            <div className="flex gap-2">
              <button onClick={() => setConfirmImport(null)} className="flex-1 border border-slate-200 rounded-xl py-2 text-xs">إلغاء</button>
              <button onClick={() => { onImportBackup(confirmImport); setConfirmImport(null); }} className="flex-1 bg-red-500 text-white rounded-xl py-2 text-xs font-semibold">نعم، استرجع</button>
            </div>
          </div>
        )}
      </div>

      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div className="font-semibold text-sm mb-2">تصنيفات الإيرادات</div>
        <div className="flex flex-wrap gap-2 mb-3">
          {data.categories.income.map(c => <span key={c} className="flex items-center gap-1 bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full">{c} <button onClick={() => onRemoveCategory("income", c)}>✕</button></span>)}
        </div>
        <div className="flex gap-2">
          <input value={newIncomeCat} onChange={e => setNewIncomeCat(e.target.value)} placeholder="تصنيف جديد" className="flex-1 bg-slate-50 rounded-xl py-2 px-3 text-sm outline-none" />
          <button onClick={() => { onAddCategory("income", newIncomeCat); setNewIncomeCat(""); }} className="bg-slate-800 text-white rounded-xl px-3 text-sm">إضافة</button>
        </div>
      </div>
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div className="font-semibold text-sm mb-2">تصنيفات المصروفات</div>
        <div className="flex flex-wrap gap-2 mb-3">
          {data.categories.expense.map(c => <span key={c} className="flex items-center gap-1 bg-red-50 text-red-600 text-xs px-2.5 py-1 rounded-full">{c} <button onClick={() => onRemoveCategory("expense", c)}>✕</button></span>)}
        </div>
        <div className="flex gap-2">
          <input value={newExpenseCat} onChange={e => setNewExpenseCat(e.target.value)} placeholder="تصنيف جديد" className="flex-1 bg-slate-50 rounded-xl py-2 px-3 text-sm outline-none" />
          <button onClick={() => { onAddCategory("expense", newExpenseCat); setNewExpenseCat(""); }} className="bg-slate-800 text-white rounded-xl px-3 text-sm">إضافة</button>
        </div>
      </div>
      <div className="text-center text-[11px] text-slate-400 pb-2">البيانات محفوظة على هذا الجهاز وهذا المتصفح فقط، افتح الملف نفسه دائمًا للوصول لها</div>
    </div>
  );
}

function TxModal({ type, setType, categories, initial, currency, partners, onClose, onSave }) {
  const isEdit = !!initial;
  const [title, setTitle] = useState(initial?.title || "");
  const [person, setPerson] = useState(initial?.person || "");
  const [partnerId, setPartnerId] = useState(initial?.partnerId || "");
  const [category, setCategory] = useState(initial?.category || "");
  const [amount, setAmount] = useState(initial?.amount ?? "");
  const [date, setDate] = useState(initial?.date || todayISO());
  const [notes, setNotes] = useState(initial?.notes || "");
  const [reason, setReason] = useState(initial?.notes || "");
  const [paymentSource, setPaymentSource] = useState(initial?.linkedCashEntryId ? "cash" : initial?.linkedNetworkEntryId ? "network" : initial?.linkedSafeEntryId ? "safe" : "none");
  const [err, setErr] = useState("");
  const cats = type === "income" ? categories.income : type === "expense" ? categories.expense : [];

  function pickWho(value) {
    if (value === "__other__") { setPartnerId(""); setPerson(""); }
    else { const p = partners.find(x => x.id === value); setPartnerId(value); setPerson(p ? p.name : ""); }
  }

  function save() {
    const amt = Number(amount);
    if (!amt || amt <= 0) return setErr("المبلغ يجب أن يكون أكبر من صفر");
    if (!date) return setErr("التاريخ مطلوب");
    if (type === "withdraw") {
      if (!person.trim()) return setErr("اسم الشخص مطلوب");
      onSave({ id: initial?.id, type, person: person.trim(), partnerId: partnerId || null, amount: amt, date, notes: reason.trim() });
    } else {
      if (!title.trim()) return setErr("اسم العملية مطلوب");
      onSave({ id: initial?.id, type, title: title.trim(), category, amount: amt, date, notes: notes.trim(), paymentSource: type === "expense" ? paymentSource : "none" });
    }
  }

  return (
    <Sheet onClose={onClose} title={isEdit ? "تعديل عملية" : "إضافة عملية"}>
      {!isEdit && (
        <div className="flex gap-2 mb-3">
          {["income", "expense", "withdraw"].map(t => (
            <button key={t} onClick={() => setType(t)} className="flex-1 text-xs py-2 rounded-xl border font-medium"
              style={type === t ? { background: TYPE_META[t].color, borderColor: TYPE_META[t].color, color: "white" } : { borderColor: "#CFD9D6", color: "#66766F" }}>
              {TYPE_META[t].label}
            </button>
          ))}
        </div>
      )}
      {type === "withdraw" ? (
        <>
          {partners && partners.length > 0 && (
            <Field label="مين اللي سحب؟">
              <select value={partnerId || (person && !partnerId ? "__other__" : "")} onChange={e => pickWho(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none mb-2">
                <option value="">اختر...</option>
                {partners.map(p => <option key={p.id} value={p.id}>شريك: {p.name}</option>)}
                <option value="__other__">شخص آخر (اكتب الاسم)</option>
              </select>
            </Field>
          )}
          {(!partnerId) && (
            <Field label="اسم الشخص"><input value={person} onChange={e => setPerson(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
          )}
        </>
      ) : (
        <>
          <Field label="اسم العملية"><input value={title} onChange={e => setTitle(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
          <Field label="التصنيف">
            <select value={category} onChange={e => setCategory(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none">
              <option value="">بدون تصنيف</option>
              {cats.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
        </>
      )}
      {type === "expense" && (
        <div className="mb-3">
          <div className="text-[11px] text-slate-400 mb-1">ادفعها من (اختياري، يخصم تلقائيًا من السجل المناسب)</div>
          <div className="grid grid-cols-2 gap-2">
            <button type="button" onClick={() => setPaymentSource("none")} className={`text-xs py-2 rounded-xl border font-medium ${paymentSource === "none" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>بدون ربط</button>
            <button type="button" onClick={() => setPaymentSource("cash")} className={`text-xs py-2 rounded-xl border font-medium ${paymentSource === "cash" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>💵 كاش</button>
            <button type="button" onClick={() => setPaymentSource("network")} className={`text-xs py-2 rounded-xl border font-medium ${paymentSource === "network" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>💳 شبكة</button>
            <button type="button" onClick={() => setPaymentSource("safe")} className={`text-xs py-2 rounded-xl border font-medium ${paymentSource === "safe" ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600"}`}>🔒 خزنة</button>
          </div>
        </div>
      )}
      <Field label={`المبلغ (${currency})`}><input type="number" value={amount} onChange={e => setAmount(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none num" /></Field>
      <Field label="التاريخ"><input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none" /></Field>
      <Field label={type === "withdraw" ? "السبب / ملاحظات" : "ملاحظات"}>
        <textarea value={type === "withdraw" ? reason : notes} onChange={e => type === "withdraw" ? setReason(e.target.value) : setNotes(e.target.value)} rows={2} className="w-full bg-slate-50 rounded-xl py-2.5 px-3 text-sm outline-none resize-none" />
      </Field>
      {err && <div className="text-red-500 text-xs mb-2">{err}</div>}
      <button onClick={save} className="w-full text-white rounded-xl py-3 text-sm font-semibold" style={{ background: TYPE_META[type].color }}>{isEdit ? "حفظ التعديل" : "إضافة"}</button>
    </Sheet>
  );
}

function Field({ label, children }) {
  return (<div className="mb-3"><div className="text-xs text-slate-400 mb-1.5">{label}</div>{children}</div>);
}

function Sheet({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/40" onClick={onClose}>
      <div className="bg-white w-full max-w-[480px] rounded-t-3xl p-5 max-h-[88vh] overflow-y-auto" onClick={e => e.stopPropagation()} dir="rtl">
        <div className="flex items-center justify-between mb-4">
          <div className="font-bold text-base">{title}</div>
          <button onClick={onClose} className="text-slate-400 text-xl leading-none">✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ConfirmModal({ title, message, onCancel, onConfirm }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-6" onClick={onCancel}>
      <div className="bg-white rounded-2xl p-5 w-full max-w-[340px]" onClick={e => e.stopPropagation()} dir="rtl">
        <div className="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center mb-3 text-red-500">⚠</div>
        <div className="font-bold text-sm mb-1.5">{title}</div>
        <div className="text-xs text-slate-500 mb-4">{message}</div>
        <div className="flex gap-2">
          <button onClick={onCancel} className="flex-1 border border-slate-200 rounded-xl py-2.5 text-sm text-slate-600">إلغاء</button>
          <button onClick={onConfirm} className="flex-1 bg-red-500 text-white rounded-xl py-2.5 text-sm font-semibold">حذف</button>
        </div>
      </div>
    </div>
  );
}

function QuickAddBar({ onPick }) {
  return (
    <div className="absolute left-0 right-0 flex justify-center pointer-events-none" style={{ bottom: 78 }}>
      <div className="flex gap-2 pointer-events-auto">
        {["income", "expense", "withdraw"].map(t => {
          const meta = TYPE_META[t];
          return (
            <button key={t} onClick={() => onPick(t)} className="flex items-center gap-1.5 text-white text-xs font-semibold px-3.5 py-2.5 rounded-full shadow-lg" style={{ background: meta.color }}>
              <span>{meta.icon}</span> {meta.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function BottomNav({ tab, setTab }) {
  const primary = [
    { id: "dashboard", label: "الرئيسية", icon: "🏠" },
    { id: "ledger", label: "العمليات", icon: "📋" },
    { id: "reports", label: "التقارير", icon: "📊" },
    { id: "more", label: "المزيد", icon: "☰" },
  ];
  const secondaryIds = ["devices", "obligations", "suppliers", "inventory", "invoices", "employees", "closing", "partners", "settings"];
  const activeId = secondaryIds.includes(tab) ? "more" : tab;
  return (
    <div className="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex items-center justify-around py-2 rounded-t-2xl">
      {primary.map(it => {
        const active = activeId === it.id;
        return (
          <button key={it.id} onClick={() => setTab(it.id)} className="flex flex-col items-center gap-0.5 px-2 py-1">
            <span className="text-base" style={{ opacity: active ? 1 : 0.55 }}>{it.icon}</span>
            <span className={`text-[10px] ${active ? "text-[#161E1A] font-semibold" : "text-slate-400"}`}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function MoreMenu({ setTab }) {
  const items = [
    { id: "devices", label: "الأجهزة", icon: "📱", desc: "شراء وبيع أجهزة مستعملة وجديدة" },
    { id: "obligations", label: "الالتزامات الثابتة", icon: "🎯", desc: "إيجار، رواتب، والتزامات شهرية" },
    { id: "suppliers", label: "المناديب والموردين", icon: "🚚", desc: "متابعة ديون مناديب قطع الغيار" },
    { id: "inventory", label: "جرد المخزون", icon: "📦", desc: "كميات القطع والأصناف الموجودة بالمحل" },
    { id: "invoices", label: "فواتير المشتريات", icon: "🧮", desc: "تسجيل فواتير الشراء وتحديث المخزون تلقائيًا" },
    { id: "employees", label: "الموظفين", icon: "🧑‍🔧", desc: "دفعات الرواتب والمتبقي لكل موظف" },
    { id: "closing", label: "التقفيلة اليومية", icon: "🧾", desc: "ملخص كامل لعمليات اليوم" },
    { id: "partners", label: "الشركاء", icon: "👥", desc: "الشركاء ونسب تقسيم الأرباح" },
    { id: "settings", label: "الإعدادات", icon: "⚙", desc: "اسم المحل، العملة، التصنيفات" },
  ];
  return (
    <div className="space-y-3">
      <div className="font-bold text-lg">المزيد</div>
      <div className="space-y-2">
        {items.map(it => (
          <button key={it.id} onClick={() => setTab(it.id)} className="w-full bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center gap-3 text-right">
            <span className="text-2xl">{it.icon}</span>
            <div className="flex-1">
              <div className="font-semibold text-sm">{it.label}</div>
              <div className="text-[11px] text-slate-400">{it.desc}</div>
            </div>
            <span className="text-slate-300">‹</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

(function () {
  var src = document.getElementById("app-source").textContent;
  var result = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] });
  var s = document.createElement("script");
  s.text = result.code;
  document.body.appendChild(s);
})();
</script>
</body>
